name: GoPush Render 24/7 Keep-Alive

on:
  schedule:
    # Every 10 minutes to prevent Render's 15-minute free sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GoPush Server Health Endpoint
        run: |
          echo "Sending keep-alive ping to GoPush server..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gopush-server.onrender.com/health)
          echo "Server responded with HTTP: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "SUCCESS: Server is awake and ready."
          else
            echo "Server waking up or returned $STATUS"
          fi
